# Compila la app de iOS en un Mac de GitHub y deja un .ipa SIN FIRMAR.
# Para instalarlo en un iPhone hay que firmarlo con tu Apple ID
# (Sideloadly o AltStore). Ver «iOS» en el README.
#
# Se lanza al subir a main, al subir una etiqueta v* (y entonces adjunta el
# .ipa a esa release) o a mano desde la pestaña Actions.
name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release a la que adjuntar el .ipa (vacío = solo artefacto)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Empaquetar .ipa sin firmar
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          IPA="to-Do-v${VERSION}-ios-unsigned.ipa"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ${{ env.IPA }}

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "to Do ${TAG#v}" --notes ""
          gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
